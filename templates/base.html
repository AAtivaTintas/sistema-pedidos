<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Pedidos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { font-family: Arial, sans-serif; background-color:#f2f2f2; margin:0; padding:0; }
        header { background:#007bff; color:white; padding:15px; text-align:center; }
        header a { color:white; margin-left:15px; text-decoration:none; }
        main { padding:20px; }
        table { width:100%; border-collapse:collapse; background:white; box-shadow:0 0 8px rgba(0,0,0,0.1); }
        th, td { border:1px solid #ccc; padding:8px; text-align:left; }
        th { background:#007bff; color:white; }
        select, input, textarea, button { padding:6px; border-radius:4px; border:1px solid #ccc; }
        button { background:#007bff; color:white; border:none; cursor:pointer; }
        button:hover { background:#0056b3; }
        .status-entregue {background-color:#28a745;color:white;}
        .status-emrota {background-color:#ffc107;color:black;}
        .status-atrasado {background-color:#dc3545;color:white;}
        .status-pendente {background-color:#6c757d;color:white;}
        .status-correcao,.status-cancelado {text-decoration:line-through;color:gray;}
        .filtro { margin-bottom:15px; }
        .filtro label { margin-right:10px; font-weight:bold; }
        .filtro select, .filtro input { margin-right:15px; }
        .btn { display:inline-block; margin:10px 0; padding:8px 12px; background:#007bff; color:white; border-radius:4px; text-decoration:none; }
        .btn:hover { background:#0056b3; }
    </style>
</head>
<body>
    <header>
        <h1>Sistema de Pedidos</h1>
        {% if session.get('user') %}
            <a href="{{ url_for('logout') }}">Sair</a>
        {% endif %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
